line-length = 120

[lint]
select = ["ALL"]
ignore = [
    "D100",
    "D101",
    "D103",
    "D105",
    "D107",
    "D203",
    "D213",
    "CPY",
    "COM812",
]
fixable = ["ALL"]
unfixable = []
future-annotations = true

[lint.isort]
split-on-trailing-comma = false

[lint.pylint]
max-args = 8

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

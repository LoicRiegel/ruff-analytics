repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.7
    hooks:
    -   id: uv-lock
  - repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false
    -   id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        pass_filenames: false
  - repo: local
    hooks:
    -   id: ty
        name: ty
        entry: uv run ty check --fix
        language: system
        pass_filenames: false
